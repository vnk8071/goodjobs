name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.server.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy on server
    runs-on: ubuntu-latest

    steps:
      # The server is arm64; GitHub-hosted runners are amd64, and a
      # cross-arch image from this workflow was never pullable there
      # (docker pull failed with "no matching manifest for linux/arm64/v8").
      # Simplest fix: skip the registry — SSH in, sync the repo, and build
      # natively on the server's own architecture.
      - name: Build and deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/goodjobs
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker build -t goodjobs-backend:latest ./backend
            export CLOUDFLARE_TUNNEL_TOKEN="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
            export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
            export WARMUP_KEYWORDS="${{ secrets.WARMUP_KEYWORDS }}"
            export ADMIN_SECRET="${{ secrets.ADMIN_SECRET }}"
            docker compose -f docker-compose.server.yml up -d --remove-orphans --force-recreate backend
