services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - internal

  backend:
    image: ${IMAGE_NAME}:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      WARMUP_KEYWORDS: ${WARMUP_KEYWORDS:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      ADMIN_SECRET: ${ADMIN_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-28800}
      AGENT_QUOTA_CALLS_PER_DAY: ${AGENT_QUOTA_CALLS_PER_DAY:-500}
      AGENT_QUOTA_LIVE_PER_DAY: ${AGENT_QUOTA_LIVE_PER_DAY:-30}
      AGENT_LIVE_CONCURRENCY: ${AGENT_LIVE_CONCURRENCY:-2}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-api.goodjobs.io.vn,localhost:*,127.0.0.1:*}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
